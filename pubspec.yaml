name: runalong
description: Record Flutter rendering performance alongside existing UI tests, without an app dependency. Offline reports, CI budgets, and local MCP tools.
version: 0.1.0
repository: https://github.com/devmithunnath/runalong
issue_tracker: https://github.com/devmithunnath/runalong/issues
environment:
  sdk: ^3.11.0
executables:
  runalong: runalong
  ral: ral
dependencies:
  analyzer: ^14.5.0
  crypto: ^3.0.7
  args: ^2.7.0
  dart_mcp: ^0.5.2
  path: ^1.9.1
  vm_service: ^15.2.0
  yaml: ^3.1.3
dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
topics:
  - flutter
  - performance
  - testing
  - devtools
  - mcp
